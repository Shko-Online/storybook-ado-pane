# Example pipeline: build a Storybook and publish it to the "Storybook" tab of the run.
# Paths are relative to the root of this repository; in your own project the sample
# folder is usually the repository root, so drop `demoDir`.
trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  demoDir: samples/demo

steps:
  - task: UseNode@1
    inputs:
      version: '22.x'

  - script: npm ci
    displayName: Install dependencies
    workingDirectory: $(demoDir)

  - script: npm run build-storybook
    displayName: Build Storybook
    workingDirectory: $(demoDir)

  # Publishes the folder as a build artifact and shows it in the "Storybook" tab of the run.
  - task: PublishStorybook@1
    displayName: Publish Storybook
    inputs:
      storybookDir: $(demoDir)/storybook-static
      title: Design system
