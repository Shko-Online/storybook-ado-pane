name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, package and build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tasks/PublishStorybook/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --engine-strict --ignore-scripts --no-audit --no-fund
          npm ci --engine-strict --ignore-scripts --no-audit --no-fund --prefix tasks/PublishStorybook

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Both variants: the private dev build has its own manifest and task identity.
      # Packaging empties out/, so each package is uploaded before the next one is made.
      - name: Package the dev build
        run: node scripts/package.mjs --dev --version 0.0.1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-dev
          path: out/*.vsix
          retention-days: 7

      - name: Package
        run: node scripts/package.mjs --version 0.0.1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: out/*.vsix
          retention-days: 7

      # The Storybook that is published to GitHub Pages from main (storybook.yml).
      - name: Build Storybook
        run: npm run build-storybook

  # The sample Storybook that the demo pipeline builds and publishes (samples/demo).
  # It has its own dependencies, which Dependabot updates separately.
  demo:
    name: Typecheck and build the demo Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: samples/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: samples/demo/package-lock.json

      - name: Install dependencies
        run: npm ci --engine-strict --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc -p tsconfig.json

      - name: Build Storybook
        run: npm run build-storybook
